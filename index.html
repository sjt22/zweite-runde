<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zweite Runde</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F3F4EF;
    --surface:#FFFFFF;
    --surface-2:#E9EBE2;
    --border:#D9DBCF;
    --text:#20302B;
    --text-muted:#5C665F;
    --accent:#3F6659;
    --accent-strong:#2E4C42;
    --accent-contrast:#FFFFFF;
    --tag-bg:#E2A33B;
    --tag-text:#43300B;
    --avail-bg:#E3F0DA; --avail-text:#375C22; --avail-dot:#5B8C3E;
    --reserved-bg:#FBEBD2; --reserved-text:#7A4E0C; --reserved-dot:#C98A2C;
    --sold-bg:#EFE2DC; --sold-text:#7A3322; --sold-dot:#B5563B;
    --shadow:0 1px 2px rgba(32,48,43,0.06), 0 6px 20px rgba(32,48,43,0.08);
    --radius:14px;
    --focus:#3F6659;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171E1B; --surface:#1F2723; --surface-2:#26302A; --border:#37423C;
      --text:#EDF1EE; --text-muted:#A9B4AE; --accent:#86BBA4; --accent-strong:#A9D4C0;
      --accent-contrast:#0E1613; --tag-bg:#E8B563; --tag-text:#3A2705;
      --avail-bg:#24361F; --avail-text:#B4DE9E; --avail-dot:#7FBF63;
      --reserved-bg:#3A2E13; --reserved-text:#ECC584; --reserved-dot:#E0A94A;
      --sold-bg:#3A241D; --sold-text:#E7B39D; --sold-dot:#CC7A5D;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      --focus:#86BBA4;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171E1B; --surface:#1F2723; --surface-2:#26302A; --border:#37423C;
    --text:#EDF1EE; --text-muted:#A9B4AE; --accent:#86BBA4; --accent-strong:#A9D4C0;
    --accent-contrast:#0E1613; --tag-bg:#E8B563; --tag-text:#3A2705;
    --avail-bg:#24361F; --avail-text:#B4DE9E; --avail-dot:#7FBF63;
    --reserved-bg:#3A2E13; --reserved-text:#ECC584; --reserved-dot:#E0A94A;
    --sold-bg:#3A241D; --sold-text:#E7B39D; --sold-dot:#CC7A5D;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    --focus:#86BBA4;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,'Times New Roman',serif; font-weight:600; margin:0; text-wrap:balance;}
  p{margin:0;}
  button{font-family:inherit;}
  input,select{font-family:inherit; font-size:inherit; color:inherit;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums;}
  img{max-width:100%; display:block;}
  a{color:var(--accent-strong);}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }
  [hidden]{display:none !important;}

  .wrap{max-width:1180px; margin:0 auto; padding:0 20px 64px;}

  .site-header{background:var(--surface); border-bottom:1px solid var(--border);}
  .header-inner{
    max-width:1180px; margin:0 auto; padding:22px 20px 18px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand h1{font-size:28px; letter-spacing:-0.01em;}
  .brand .sub{color:var(--text-muted); font-size:14px;}
  .lang-toggle{display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; background:var(--surface-2); flex-shrink:0;}
  .lang-toggle button{
    border:none; background:transparent; padding:6px 12px; font-size:13px; font-weight:700;
    color:var(--text-muted); cursor:pointer; letter-spacing:0.02em;
  }
  .lang-toggle button.active{background:var(--accent); color:var(--accent-contrast);}
  .btn{
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    border-radius:999px; border:1px solid transparent; padding:10px 18px;
    font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap;
    transition:transform .12s ease, box-shadow .12s ease; text-decoration:none;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent); color:var(--accent-contrast);}
  .btn-primary:hover{box-shadow:var(--shadow);}
  .btn-secondary{background:var(--surface); color:var(--text); border-color:var(--border);}
  .btn-secondary:hover{background:var(--surface-2);}
  .btn-block{width:100%;}

  .filter-bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:18px 0 6px;}
  .search-input{flex:1 1 220px; min-width:160px; padding:10px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text);}
  .select-input{padding:10px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text);}
  .check-pill{display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:13px; color:var(--text-muted); cursor:pointer;}
  .storage-note{color:var(--text-muted); font-size:12px; padding:2px 0 4px;}

  .items-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:18px; padding:14px 0 20px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; cursor:pointer; text-align:left; padding:0; display:flex; flex-direction:column;
    box-shadow:var(--shadow); transition:transform .14s ease;
  }
  .card:hover{transform:translateY(-2px);}
  .card.is-sold{opacity:0.62;}
  .card-photo{position:relative; aspect-ratio:4/3; background:var(--surface-2); overflow:hidden;}
  .card-photo img{width:100%; height:100%; object-fit:cover;}
  .no-photo{width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:36px; color:var(--text-muted);}
  .status-pill{
    position:absolute; top:10px; left:10px; font-size:11px; font-weight:700; letter-spacing:0.02em;
    padding:4px 9px; border-radius:999px; display:flex; align-items:center; gap:5px;
  }
  .status-pill .dot{width:7px; height:7px; border-radius:50%;}
  .status-available{background:var(--avail-bg); color:var(--avail-text);}
  .status-available .dot{background:var(--avail-dot);}
  .status-reserved{background:var(--reserved-bg); color:var(--reserved-text);}
  .status-reserved .dot{background:var(--reserved-dot);}
  .status-sold{background:var(--sold-bg); color:var(--sold-text);}
  .status-sold .dot{background:var(--sold-dot);}
  .price-tag{
    position:absolute; bottom:-6px; left:12px; background:var(--tag-bg); color:var(--tag-text);
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; padding:5px 10px 8px;
    border-radius:4px; transform:rotate(-3deg); box-shadow:var(--shadow);
  }
  .price-tag::after{
    content:""; position:absolute; top:50%; left:-4px; width:8px; height:8px; background:var(--bg);
    border-radius:50%; transform:translateY(-50%); border:1px solid rgba(0,0,0,0.15);
  }
  .price-tag.is-ask{font-family:'Karla',sans-serif; font-weight:700; font-size:11.5px;}
  .card-body{padding:16px 14px 14px; display:flex; flex-direction:column; gap:4px; flex:1;}
  .card-title{font-size:16px; line-height:1.3;}
  .card-cat{color:var(--text-muted); font-size:12.5px;}
  .empty-state{grid-column:1/-1; text-align:center; padding:56px 20px; color:var(--text-muted); border:1.5px dashed var(--border); border-radius:var(--radius);}
  .empty-state h2{color:var(--text); font-size:20px; margin-bottom:6px;}

  .overlay-scrim{position:fixed; inset:0; background:rgba(20,26,23,0.5); backdrop-filter:blur(1px); display:flex; justify-content:flex-end; z-index:40;}
  .drawer{background:var(--bg); width:min(560px, 100%); height:100%; overflow-y:auto; box-shadow:-8px 0 30px rgba(0,0,0,0.2); animation:slidein .22s ease;}
  @keyframes slidein{from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;}}
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:1;
  }
  .drawer-body{padding:20px;}
  .drawer-body h2{font-size:22px; margin-bottom:2px;}

  .gallery-main{width:100%; aspect-ratio:4/3; border-radius:var(--radius); overflow:hidden; background:var(--surface-2); display:flex; align-items:center; justify-content:center; margin-bottom:10px;}
  .gallery-main img{width:100%; height:100%; object-fit:cover;}
  .gallery-thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .gallery-thumbs button{width:56px; height:56px; border-radius:8px; overflow:hidden; border:2px solid transparent; padding:0; cursor:pointer; background:var(--surface-2);}
  .gallery-thumbs button.active{border-color:var(--accent);}
  .gallery-thumbs img{width:100%; height:100%; object-fit:cover;}
  .photo-hint{font-size:12px; color:var(--text-muted); margin-bottom:18px;}

  .meta-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0 16px;}
  .price-display{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:20px;}
  .price-display.is-ask{font-family:'Fraunces',serif; font-size:16px; font-style:italic; color:var(--text-muted);}
  .description-text{white-space:pre-wrap; color:var(--text); margin-bottom:20px; line-height:1.6;}

  .contact-actions{display:flex; flex-direction:column; gap:8px;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--accent-strong); color:var(--accent-contrast); padding:11px 18px; border-radius:999px;
    font-size:13.5px; box-shadow:var(--shadow); z-index:80; max-width:90vw; text-align:center;
  }

  @media (max-width:640px){
    .drawer{width:100%;}
    .header-inner{padding:18px 16px 14px;}
    .wrap{padding:0 16px 64px;}
  }
</style>

      noItems:"Aktuell keine Artikel verfügbar.",
      noItemsFiltered:"Keine Artikel gefunden.",
      priceOnRequest:"Preis auf Anfrage",
      statusAvailable:"Verfügbar",
      statusReserved:"Reserviert",
      statusSold:"Verkauft",
      back:"Zurück",
      messagePrivately:"Privat per WhatsApp anschreiben",
      openGroup:"WhatsApp-Gruppe öffnen",
      photoHint:"Tipp: Foto gedrückt halten, um es zu speichern.",
      whatsappMsgIntro:"Hallo! Ich interessiere mich für",
      soldHiddenNote:"%s verkaufte ausgeblendet"
    },
    en:{
      subtitle:"Baby & kids items to pass on",
      searchPlaceholder:"Search…",
      allCategories:"All categories",
      showSold:"Show sold",
      noItems:"No items available right now.",
      noItemsFiltered:"No items found.",
      priceOnRequest:"Price on request",
      statusAvailable:"Available",
      statusReserved:"Reserved",
      statusSold:"Sold",
      back:"Back",
      messagePrivately:"Message privately on WhatsApp",
      openGroup:"Open WhatsApp group",
      photoHint:"Tip: press and hold a photo to save it.",
      whatsappMsgIntro:"Hi! I'm interested in",
      soldHiddenNote:"%s sold hidden"
    }
  };

  /* ================= View state ================= */
  var lang = "de";
  try {
    var savedLang = window.localStorage && window.localStorage.getItem("zr-lang");
    if (savedLang === "de" || savedLang === "en") lang = savedLang;
  } catch(e){}

  var view = { mode:"grid", detailId:null, galleryIndex:0 };
  var filters = { search:"", category:"", showSold:false };
  var toastTimer = null;

  /* ================= Helpers ================= */
  function t(key){ return (I18N[lang] && I18N[lang][key]) || I18N.de[key] || key; }
  function fmt(str){
    var args = Array.prototype.slice.call(arguments, 1);
    var i = 0;
    return str.replace(/%s/g, function(){ return args[i++]; });
  }
  function esc(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];
    });
  }
  function categoryLabel(value){
    var c = CATEGORIES.filter(function(x){ return x.value === value; })[0];
    if (!c) return "";
    return c.emoji + " " + c[lang === "en" ? "en" : "de"];
  }
  function descriptionFor(item){
    var d = item.description;
    if (d && typeof d === "object"){
      return d[lang] || d.de || d.en || "";
    }
    return d || "";
  }
  function byId(id){ return document.getElementById(id); }
  function qs(sel, root){ return (root||document).querySelector(sel); }
  function qsa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function permalinkFor(itemId){ return window.location.origin + window.location.pathname + "#item-" + itemId; }

  function showToast(msg){
    var el = byId("toast");
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.hidden = true; }, 3400);
  }

  function statusLabelFor(status){
    if (status === "reserved") return t("statusReserved");
    if (status === "sold") return t("statusSold");
    return t("statusAvailable");
  }

  /* ================= Rendering: grid ================= */
  function visibleItems(){
    return STATE.items.filter(function(it){
      if (!filters.showSold && it.status === "sold") return false;
      if (filters.category && it.category !== filters.category) return false;
      if (filters.search){
        var s = filters.search.toLowerCase();
        var descBoth = (it.description && typeof it.description === "object")
          ? ((it.description.de || "") + " " + (it.description.en || ""))
          : (it.description || "");
        var hay = (it.title + " " + descBoth).toLowerCase();
        if (hay.indexOf(s) === -1) return false;
      }
      return true;
    }).sort(function(a,b){
      var rank = {available:0, reserved:1, sold:2};
      var ra = rank[a.status] != null ? rank[a.status] : 3;
      var rb = rank[b.status] != null ? rank[b.status] : 3;
      if (ra !== rb) return ra - rb;
      return (b.createdAt||0) - (a.createdAt||0);
    });
  }

  function cardHTML(item){
    var photo = item.photos && item.photos[0];
    var priceHTML;
    if (item.priceOnRequest || item.price == null || item.price === ""){
      priceHTML = "<span class=\"price-tag is-ask\">" + esc(t("priceOnRequest")) + "</span>";
    } else {
      priceHTML = "<span class=\"price-tag mono\">CHF " + esc(item.price) + "</span>";
    }
    return (
      "<article class=\"card" + (item.status === "sold" ? " is-sold" : "") + "\" data-id=\"" + item.id + "\" data-action=\"open-detail\" tabindex=\"0\" role=\"button\">" +
        "<div class=\"card-photo\">" +
          (photo ? "<img src=\"" + photo + "\" alt=\"\" loading=\"lazy\">" : "<div class=\"no-photo\">🧸</div>") +
          "<span class=\"status-pill status-" + item.status + "\"><span class=\"dot\"></span>" + esc(statusLabelFor(item.status)) + "</span>" +
          priceHTML +
        "</div>" +
        "<div class=\"card-body\">" +
          "<h3 class=\"card-title\">" + esc(item.title) + "</h3>" +
          "<p class=\"card-cat\">" + categoryLabel(item.category) + "</p>" +
        "</div>" +
      "</article>"
    );
  }

  function renderGrid(){
    var grid = byId("items-grid");
    if (!grid) return;
    var items = visibleItems();
    var soldCount = STATE.items.filter(function(it){ return it.status === "sold"; }).length;
    var soldHiddenCount = filters.showSold ? 0 : soldCount;
    if (STATE.items.length === 0){
      grid.innerHTML = "<div class=\"empty-state\"><h2>👋</h2><p>" + esc(t("noItems")) + "</p></div>";
    } else if (items.length === 0){
      grid.innerHTML = "<div class=\"empty-state\"><p>" + esc(t("noItemsFiltered")) + "</p></div>";
    } else {
      grid.innerHTML = items.map(cardHTML).join("");
    }
    var note = byId("sold-hidden-note");
    if (note){
      if (soldHiddenCount > 0){ note.hidden = false; note.textContent = fmt(t("soldHiddenNote"), soldHiddenCount); }
      else { note.hidden = true; }
    }
    qsa("[data-action='open-detail']", grid).forEach(function(card){
      card.addEventListener("click", function(){ openDetail(card.getAttribute("data-id")); });
      card.addEventListener("keydown", function(ev){
        if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); openDetail(card.getAttribute("data-id")); }
      });
    });
  }

  function categoryOptionsHTML(selected, includeAll){
    var out = "";
    if (includeAll) out += "<option value=\"\">" + esc(t("allCategories")) + "</option>";
    CATEGORIES.forEach(function(c){
      out += "<option value=\"" + c.value + "\"" + (selected === c.value ? " selected" : "") + ">" + c.emoji + " " + esc(c[lang === "en" ? "en" : "de"]) + "</option>";
    });
    return out;
  }

  function shellHTML(){
    return (
      "<header class=\"site-header\">" +
        "<div class=\"header-inner\">" +
          "<div class=\"brand\">" +
            "<h1>Zweite Runde</h1>" +
            "<p class=\"sub\">" + esc(t("subtitle")) + "</p>" +
          "</div>" +
          "<div class=\"lang-toggle\">" +
            "<button type=\"button\" data-action=\"set-lang\" data-lang=\"de\" class=\"" + (lang==="de"?"active":"") + "\">DE</button>" +
            "<button type=\"button\" data-action=\"set-lang\" data-lang=\"en\" class=\"" + (lang==="en"?"active":"") + "\">EN</button>" +
          "</div>" +
        "</div>" +
      "</header>" +
      "<div class=\"wrap\">" +
        "<div class=\"filter-bar\">" +
          "<input type=\"text\" id=\"search-input\" class=\"search-input\" placeholder=\"" + esc(t("searchPlaceholder")) + "\" value=\"" + esc(filters.search) + "\">" +
          "<select id=\"category-filter\" class=\"select-input\">" + categoryOptionsHTML(filters.category, true) + "</select>" +
          "<label class=\"check-pill\"><input type=\"checkbox\" id=\"show-sold-toggle\"" + (filters.showSold ? " checked" : "") + "> " + esc(t("showSold")) + "</label>" +
        "</div>" +
        "<p class=\"storage-note\" id=\"sold-hidden-note\" hidden></p>" +
        "<div class=\"items-grid\" id=\"items-grid\"></div>" +
      "</div>" +
      "<div id=\"overlay-root\"></div>" +
      "<div class=\"toast\" id=\"toast\" hidden></div>"
    );
  }

  function renderShell(){
    var app = byId("app");
    var activeEl = document.activeElement;
    var activeId = activeEl && activeEl.id;
    var selStart, selEnd;
    if (activeId === "search-input"){ selStart = activeEl.selectionStart; selEnd = activeEl.selectionEnd; }
    app.innerHTML = shellHTML();
    renderGrid();
    bindShellEvents();
    if (activeId){
      var el = byId(activeId);
      if (el && el.focus){
        el.focus();
        if (selStart != null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
      }
    }
  }

  function bindShellEvents(){
    qsa("[data-action='set-lang']").forEach(function(btn){
      btn.addEventListener("click", function(){
        lang = btn.getAttribute("data-lang");
        try { window.localStorage && window.localStorage.setItem("zr-lang", lang); } catch(e){}
        renderShell();
      });
    });
    var search = byId("search-input");
    if (search) search.addEventListener("input", function(){ filters.search = search.value; renderGrid(); });
    var catFilter = byId("category-filter");
    if (catFilter){
      catFilter.value = filters.category;
      catFilter.addEventListener("change", function(){ filters.category = catFilter.value; renderGrid(); });
    }
    var showSold = byId("show-sold-toggle");
    if (showSold) showSold.addEventListener("change", function(){ filters.showSold = showSold.checked; renderGrid(); });
  }

  /* ================= Overlay helpers ================= */
  function openOverlay(innerHTML){
    var root = byId("overlay-root");
    var scrim = document.createElement("div");
    scrim.className = "overlay-scrim";
    scrim.innerHTML = "<div class=\"drawer\">" + innerHTML + "</div>";
    scrim.addEventListener("mousedown", function(ev){ if (ev.target === scrim) closeOverlay(); });
    root.innerHTML = "";
    root.appendChild(scrim);
    document.addEventListener("keydown", escListener);
    return scrim;
  }
  function escListener(ev){ if (ev.key === "Escape") closeOverlay(); }
  function closeOverlay(){
    var root = byId("overlay-root");
    root.innerHTML = "";
    document.removeEventListener("keydown", escListener);
    try { history.replaceState(null, "", window.location.pathname + window.location.search); } catch(e){}
    view.mode = "grid";
  }

  /* ================= Detail view ================= */
  function openDetail(itemId){
    var item = STATE.items.filter(function(it){ return it.id === itemId; })[0];
    if (!item) return;
    view.mode = "detail"; view.detailId = itemId; view.galleryIndex = 0;
    try { history.replaceState(null, "", "#item-" + itemId); } catch(e){}
    renderDetail();
  }

  function renderDetail(){
    var item = STATE.items.filter(function(it){ return it.id === view.detailId; })[0];
    if (!item){ closeOverlay(); return; }
    var photos = item.photos && item.photos.length ? item.photos : [];
    var mainPhoto = photos[view.galleryIndex] || photos[0];
    var priceHTML = (item.priceOnRequest || item.price == null || item.price === "")
      ? "<span class=\"price-display is-ask\">" + esc(t("priceOnRequest")) + "</span>"
      : "<span class=\"price-display mono\">CHF " + esc(item.price) + "</span>";

    var thumbsHTML = photos.length > 1 ? "<div class=\"gallery-thumbs\">" + photos.map(function(p, i){
      return "<button type=\"button\" data-action=\"gallery-select\" data-index=\"" + i + "\" class=\"" + (i === view.galleryIndex ? "active" : "") + "\"><img src=\"" + p + "\" alt=\"\"></button>";
    }).join("") + "</div>" : "";

    var whatsappNumber = (STATE.config.whatsappNumber || "").replace(/[^0-9]/g, "");
    var privateMsg = t("whatsappMsgIntro") + " \"" + item.title + "\" (" + permalinkFor(item.id) + ")";
    var privateHTML = whatsappNumber
      ? "<a class=\"btn btn-secondary btn-block\" target=\"_blank\" rel=\"noopener\" href=\"https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(privateMsg) + "\">💬 " + esc(t("messagePrivately")) + "</a>"
      : "";
    var groupHTML = STATE.config.whatsappGroupLink
      ? "<a class=\"btn btn-secondary btn-block\" target=\"_blank\" rel=\"noopener\" href=\"" + esc(STATE.config.whatsappGroupLink) + "\">👥 " + esc(t("openGroup")) + "</a>"
      : "";

    var html =
      "<div class=\"drawer-head\">" +
        "<button type=\"button\" class=\"btn btn-secondary\" data-action=\"close-detail\">← " + esc(t("back")) + "</button>" +
      "</div>" +
      "<div class=\"drawer-body\">" +
        "<div class=\"gallery-main\">" + (mainPhoto ? "<img src=\"" + mainPhoto + "\" alt=\"\">" : "<div class=\"no-photo\">🧸</div>") + "</div>" +
        thumbsHTML +
        (photos.length ? "<p class=\"photo-hint\">" + esc(t("photoHint")) + "</p>" : "") +
        "<h2>" + esc(item.title) + "</h2>" +
        "<div class=\"meta-row\">" +
          "<span class=\"status-pill status-" + item.status + "\"><span class=\"dot\"></span>" + esc(statusLabelFor(item.status)) + "</span>" +
          "<span>" + categoryLabel(item.category) + "</span>" +
          priceHTML +
        "</div>" +
        "<p class=\"description-text\">" + esc(descriptionFor(item)) + "</p>" +
        "<div class=\"contact-actions\">" + privateHTML + groupHTML + "</div>" +
      "</div>";

    var scrim = openOverlay(html);
    qs("[data-action='close-detail']", scrim).addEventListener("click", closeOverlay);
    qsa("[data-action='gallery-select']", scrim).forEach(function(btn){
      btn.addEventListener("click", function(){ view.galleryIndex = parseInt(btn.getAttribute("data-index"), 10); renderDetail(); });
    });
  }

  /* ================= Boot ================= */
  function boot(){
    renderShell();
    var hash = window.location.hash || "";
    var m = /^#item-(.+)$/.exec(hash);
    if (m){
      var exists = STATE.items.filter(function(it){ return it.id === m[1]; })[0];
      if (exists) openDetail(m[1]);
    }
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
